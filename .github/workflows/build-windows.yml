name: Build Windows executable

on:
  workflow_dispatch: {}

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Ensure pip up-to-date
        run: python -m pip install -U pip

      - name: Install build dependencies
        # Use the repo's Windows build script to install requirements if present
        run: |
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt } else { Write-Host 'No requirements.txt' }
          if (Test-Path requirements-build.txt) { python -m pip install -r requirements-build.txt } else { python -m pip install -U pyinstaller }
        shell: pwsh

      - name: Run Windows build script (PyInstaller)
        run: pwsh -File .\scripts\build_win.ps1 -Python python

      - name: Package dist folder
        if: success()
        run: |
          $out = 'dist\SnowSurvivor-win'
          if (Test-Path $out) {
            # create a runtime README to help end-users (VC++ redistributable, extract before running, AV)
            $readme = @'
SnowSurvivor (Windows) - runtime notes

- Extract the zip completely before running the EXE. Do NOT run from inside the zip.
- If you see "failed to load python DLL", make sure the python*.dll files exist next to the EXE.
- If DLLs are missing, check your antivirus/quarantine and restore any quarantined files.
- Install the Microsoft Visual C++ Redistributable for Visual Studio 2015-2022 (x64):
  https://learn.microsoft.com/en-US/cpp/windows/latest-supported-vc-redist
- If SmartScreen or antivirus blocks the EXE, instruct users to right-click -> Open or add an exception.
'
            $readmePath = Join-Path $out 'README_WINDOWS.txt'
            Set-Content -Path $readmePath -Value $readme -Encoding UTF8

            Compress-Archive -Path $out\* -DestinationPath SnowSurvivor-win.zip -Force
            Write-Host "Created SnowSurvivor-win.zip (includes README_WINDOWS.txt)"
          } else {
            Write-Host "Expected output folder not found: $out"
            dir dist -Recurse
            exit 1
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnowSurvivor-windows
          path: SnowSurvivor-win.zip
